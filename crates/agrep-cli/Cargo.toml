[package]
name = "agrep-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true

# The ingest engine. `agrep index` (cli.py) shells out to this `agrep-rs` binary.
[[bin]]
name = "agrep-rs"
path = "src/main.rs"

[dependencies]
agrep-core = { path = "../agrep-core" }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
sha2 = { workspace = true }
# Ownership preflight reads corpus.db metadata without opening it writable.
# The same bundled SQLite is already linked by agrep-core's opencode adapter.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
# Test builds force one adapter parse to panic and prove the run still publishes around it, and
# let a test make the owner fence see records vanish between its scan and its read.
agrep-core = { path = "../agrep-core", features = ["parse-panic-injection", "owner-vanish-injection"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
