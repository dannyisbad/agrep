[package]
name = "agrep-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
memchr = { workspace = true }
bincode = { workspace = true }
anyhow = { workspace = true }
rayon = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
unicode-normalization = { workspace = true }
unicode-segmentation = { workspace = true }
flate2 = { workspace = true }
# bundled => compiles SQLite from C source (needs cl.exe under the MSVC toolchain on Windows).
# Used by the opencode sqlite adapter (per-build chat stores live in *.db files).
rusqlite = { version = "0.32", features = ["bundled"] }
# kimi-cli keys its per-workdir session dirs by md5(workdir path); ~/.kimi/kimi.json holds
# the real paths, so we hash each registered path to find its sessions dir.
md5 = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_Storage_Compression",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
] }
