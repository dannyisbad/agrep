[package]
name = "agrep-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []

[dependencies]
candle-core = { version = "=0.9.2", default-features = false }
candle-nn = { version = "=0.9.2", default-features = false }
candle-transformers = { version = "=0.9.2", default-features = false }
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
ureq = { version = "=3.5.0", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls-rustcrypto = "=0.0.2-alpha"
memmap2 = "0.9"
half = "2"

tempfile = "3"
fancy-regex = "0.14"
regex = "1"
regex-syntax = "0.8"
shlex = "2"
globset = "0.4"
lz4_flex = "0.11"
blake2b_simd = "1"

serde = { workspace = true }
serde_json = { workspace = true }
memchr = { workspace = true }
anyhow = { workspace = true }
rayon = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
unicode-normalization = { workspace = true }
unicode-segmentation = { workspace = true }
flate2 = { workspace = true }
zlib-rs = "=0.6.8"
# bundled => compiles SQLite from C source (needs cl.exe under the MSVC toolchain on Windows).
# Used by the opencode sqlite adapter (per-build chat stores live in *.db files).

rusqlite = { version = "0.32", features = ["bundled", "hooks", "functions", "backup"] }
# kimi-cli keys its per-workdir session dirs by md5(workdir path); ~/.kimi/kimi.json holds
# the real paths, so we hash each registered path to find its sessions dir.
md5 = "0.7"
getrandom = "0.2"
crossterm = "0.28"

[target.'cfg(unix)'.dependencies]
# Hardened opens need the per-architecture O_* values, and SQLite snapshots probe a writer's
# lock on the live database; the linear-time proofs time their own thread's CPU.
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Globalization",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Kernel",
    "Wdk_System_Threading",
    "Win32_Security_Cryptography",
    "Win32_Storage_Compression",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
] }

[target.'cfg(target_os = "macos")'.dependencies]
candle-metal-kernels = "=0.9.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString"] }
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLTypes"] }
candle-core = { version = "=0.9.2", default-features = false, features = ["metal", "accelerate"] }
candle-nn = { version = "=0.9.2", default-features = false, features = ["metal", "accelerate"] }
candle-transformers = { version = "=0.9.2", default-features = false, features = ["metal", "accelerate"] }

[dev-dependencies]
tempfile = "3"
brotli = "=8.0.4"
