[package]
name = "agrep"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
agrep-core = { path = "../agrep-core" }
clap = { workspace = true }
# clap's own terminal-width probe (wrap_help), so narrow help layouts match its wrapping.
terminal_size = "0.4"
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
memchr = { workspace = true }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
mimalloc = { version = "0.1.52", default-features = false }
rayon = { workspace = true }
sha2 = { workspace = true }
# The full audit reads Codex's compressed rollouts itself.
zstd = { workspace = true }
[dev-dependencies]
flate2 = { workspace = true }
lz4_flex = "0.11"
brotli = "8"
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libmimalloc-sys = { version = "=0.1.49", default-features = false, features = ["extended"] }
