name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Isolate all source discovery and derived data
        shell: bash
        run: |
          echo "AGREP_HOME=$RUNNER_TEMP/agrep-test-home" >> "$GITHUB_ENV"
          echo "AGREP_DATA_DIR=$RUNNER_TEMP/agrep-test-data" >> "$GITHUB_ENV"
      - name: Rust formatting, lint and tests
        shell: bash
        run: |
          set -euo pipefail
          nice -n 10 cargo fmt --check
          nice -n 10 cargo clippy --workspace --all-targets -- -D warnings
          nice -n 10 cargo test --workspace --no-fail-fast 2>&1 | tee rust-tests.log
      - name: Distribution contracts and skip policy
        shell: bash
        run: |
          set -euo pipefail
          nice -n 10 python -m unittest discover -s bench -p 'test_*.py' -v 2>&1 | tee distribution-tests.log
          nice -n 10 node --test npm/test_bin.js 2>&1 | tee npm-tests.log
          python bench/check_skips.py rust-tests.log distribution-tests.log npm-tests.log
          python bench/release_identity.py
          python bench/validate_repo_privacy.py --worktree --index
          nice -n 10 python bench/third_party_licenses.py --check
      - name: Full-process blocking performance gates
        shell: bash
        run: |
          set -euo pipefail
          nice -n 10 cargo build --locked --release --workspace --bins --examples
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          performance_status=0
          nice -n 10 "target/release/examples/bench$suffix" --binary "target/release/agrep$suffix" --rows 100000 --runs 20 --build-runs 3 --check --output mixed.json || performance_status=1
          nice -n 10 "target/release/examples/bench$suffix" --binary "target/release/agrep$suffix" --semantic --data "$RUNNER_TEMP/agrep-semantic-data" --rows 1000 --runs 20 --build-runs 3 --check --output semantic.json || performance_status=1
          nice -n 10 "target/release/examples/semantic_eval$suffix" "$RUNNER_TEMP/agrep-semantic-data/model/granite-embedding-small-english-r2" cpu || performance_status=1
          nice -n 10 python bench/semantic_owner.py --binary "target/release/agrep$suffix" --builder "target/release/examples/semantic_scale$suffix" --evaluator "target/release/examples/semantic_eval$suffix" --model "$RUNNER_TEMP/agrep-semantic-data/model/granite-embedding-small-english-r2" --runs 20 --output semantic.json.owner.json || performance_status=1
          nice -n 10 "target/release/examples/bench$suffix" --binary "target/release/agrep$suffix" --dense --rows 2000000 --runs 20 --build-runs 3 --check --output dense.json || performance_status=1
          exit "$performance_status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: |
            *-tests.log
            mixed.json*
            dense.json*
            semantic.json*
  privacy-history:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python bench/validate_repo_privacy.py --index --all-refs
