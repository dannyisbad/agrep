name: release
run-name: publish agrep ${{ github.ref_name }}
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gates:
    uses: ./.github/workflows/ci.yml
  identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python bench/release_identity.py --tag '${{ github.ref_name }}'
      - run: python bench/validate_repo_privacy.py --worktree --index --all-refs
  build:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, plat: manylinux_2_28_x86_64, asset: agrep-linux-x64, exe: agrep, image: 'quay.io/pypa/manylinux_2_28_x86_64@sha256:b04887b645dde99b9e955aeae3ff4da414992d0bd88259f046295b56361c5614'}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, plat: manylinux_2_28_aarch64, asset: agrep-linux-arm64, exe: agrep, image: 'quay.io/pypa/manylinux_2_28_aarch64@sha256:d129a18d4aeecc9ce6db592474bdb127838339eed67cd7cd61617bb027b14c1e'}
          - {os: macos-14, target: aarch64-apple-darwin, plat: macosx_11_0_arm64, asset: agrep-macos-arm64, exe: agrep, image: ''}
          - {os: macos-15-intel, target: x86_64-apple-darwin, plat: macosx_11_0_x86_64, asset: agrep-macos-x64, exe: agrep, image: ''}
          - {os: windows-latest, target: x86_64-pc-windows-msvc, plat: win_amd64, asset: agrep-windows-x64.exe, exe: agrep.exe, image: ''}
          - {os: windows-11-arm, target: aarch64-pc-windows-msvc, plat: win_arm64, asset: agrep-windows-arm64.exe, exe: agrep.exe, image: ''}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        if: runner.os != 'Linux'
        with:
          toolchain: '1.97.0'
          targets: ${{ matrix.target }}
      - name: Build native macOS or Windows binary with private paths remapped
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          nice -n 10 python bench/build_binary.py --target '${{ matrix.target }}'
      - name: Build Linux binary inside the pinned manylinux 2.28 image
        if: runner.os == 'Linux'
        env:
          IMAGE: ${{ matrix.image }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/agrep" -w /agrep -e TARGET "$IMAGE" bash -euc '
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.0
            source "$HOME/.cargo/env"
            nice -n 10 /opt/python/cp312-cp312/bin/python bench/build_binary.py --target "$TARGET"
          '
      - name: Validate and smoke the binary, then build and install its wheel
        env:
          AGREP_WHEEL_PLAT: ${{ matrix.plat }}
          AGREP_WHEEL_BINARY: target/${{ matrix.target }}/release/${{ matrix.exe }}
        shell: bash
        run: |
          set -euo pipefail
          python bench/validate_binary_privacy.py "$AGREP_WHEEL_BINARY" --forbid "$GITHUB_WORKSPACE" --forbid "$HOME" --forbid "${USERPROFILE:-}" --forbid "${RUNNER_TEMP:-}"
          nice -n 10 python bench/smoke.py -- "$AGREP_WHEEL_BINARY"
          python -m pip install --disable-pip-version-check build==1.5.0
          python -m build --wheel --no-isolation
          python bench/validate_wheel.py dist/*.whl
          python bench/release_identity.py --tag '${{ github.ref_name }}' dist/*.whl
          python -m venv installed
          if [ "$RUNNER_OS" = Windows ]; then vpython=installed/Scripts/python.exe; launcher=installed/Scripts/agrep.exe
          else vpython=installed/bin/python; launcher=installed/bin/agrep; fi
          "$vpython" -m pip install --no-deps dist/*.whl
          nice -n 10 python bench/smoke.py --semantic -- "$launcher"
      - name: Validate the manylinux ABI policy
        if: runner.os == 'Linux'
        env:
          IMAGE: ${{ matrix.image }}
          POLICY: ${{ matrix.plat }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/agrep" -w /agrep -e POLICY "$IMAGE" bash -euc '
            auditwheel show dist/*.whl > auditwheel.txt
            /opt/python/cp312-cp312/bin/python bench/validate_manylinux.py --target "$POLICY" auditwheel.txt
          '
      - name: Stage the exact release binary
        shell: bash
        run: |
          mkdir -p assets
          cp 'target/${{ matrix.target }}/release/${{ matrix.exe }}' 'assets/${{ matrix.asset }}'
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: |
            dist/*.whl
            assets/*
          if-no-files-found: error
  assemble:
    needs: [gates, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: inputs
          merge-multiple: true
      - run: python bench/prepare_release.py --assets inputs/assets --wheels inputs/dist --output sealed
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: sealed/assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: sealed/npm/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: inputs/dist/*.whl
          if-no-files-found: error
  github:
    needs: assemble
    if: github.repository == 'dannyisbad/agrep' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: assets/*
          body: |
            agrep 0.5: one Rust binary for local agent-history search.
            Install with `uv tool install agrep` or `npm install -g @mundy/agrep`.
            Before upgrading, run `agrep remove` with 0.4 to remove its instruction blocks, hooks and uninstall sentinel.
            0.4 data stays in `~/Library/Application Support/agrep` (macOS), `~/.local/share/agrep` (Linux), or `%LOCALAPPDATA%\agrep` (Windows).
            Then install 0.5, build a fresh index and run `agrep setup`.
  npm-smoke:
    needs: github
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package
      - name: Install the exact tarball and download its pinned release binary
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix installed --ignore-scripts ./package/*.tgz
          nice -n 10 python bench/smoke.py --semantic -- node installed/node_modules/@mundy/agrep/bin.js
  pypi:
    needs: npm-smoke
    if: github.repository == 'dannyisbad/agrep' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
  npm:
    needs: npm-smoke
    if: github.repository == 'dannyisbad/agrep' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package
      - run: npm publish package/*.tgz --access public --provenance --ignore-scripts

  promote:
    needs: [pypi, npm]
    if: github.repository == 'dannyisbad/agrep' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit '${{ github.ref_name }}' --repo '${{ github.repository }}' --prerelease=false --latest
