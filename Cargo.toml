[workspace]
members = ["crates/agrep-core", "crates/agrep-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
memchr = "2"
bincode = "1"
anyhow = "1"
rayon = "1"
chrono = "0.4"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
# Python 3.14's boundary oracle is pinned to Unicode 16, so all table crates stay exact.
unicode-normalization = "=0.1.24"
unicode-segmentation = "=1.12.0"

[profile.release]
opt-level = 3
lto = "fat"          # whole-program inlining across crates (ingest is the hot path)
codegen-units = 1    # one unit -> best optimization, slower build (we build rarely)
panic = "unwind"     # resident protocol workers contain request panics and keep serving
strip = true         # drop debug symbols from the release binary
