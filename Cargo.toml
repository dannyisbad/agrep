[workspace]
members = ["crates/agrep-core", "crates/agrep"]
resolver = "2"
[workspace.package]
edition = "2021"
version = "0.5.0"
license = "MIT"
[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
memchr = "2"
anyhow = "1"
rayon = "1"
chrono = "0.4"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.11"
unicode-normalization = "=0.1.24"
unicode-segmentation = "=1.12.0"
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
[profile.dev]
debug = 0
incremental = false
