[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "agrep"
dynamic = ["version"]
description = "Search and watch your cross-agent coding chat history (Claude, Codex, opencode, Antigravity, Kimi, Cline, Gemini, Crush, Cursor, pi, oh-my-pi) in one place."
readme = "README.md"
license = { file = "LICENSE" }
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.txt"]
requires-python = ">=3.10"
keywords = ["claude", "codex", "opencode", "antigravity", "kimi", "cline", "gemini", "crush", "cursor", "pi", "oh-my-pi", "agent", "chat", "history", "semantic-search", "cli"]
authors = [{ name = "mundy" }]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
# Semantic deps install where upstream wheels exist. String membership avoids
# PEP 440 parsing of vendor-suffixed Linux platform-release values.
dependencies = [
    # Pure-python, unconditioned: the model and binary fetches verify TLS with
    # certifi where the platform store lacks the chain (seen on clean Windows).
    "certifi",
    # The Metal lane ships by default where it can run (Apple silicon on a
    # macOS new enough for mlx wheels); absent, every path is the CPU lane.
    "mlx>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64' and '20.' not in platform_release and '21.' not in platform_release",
    "numpy>=1.24; (python_version >= '3.11' or sys_platform != 'win32' or platform_machine != 'ARM64') and (sys_platform != 'darwin' or python_version < '3.13' or (python_version < '3.14' and '20.' not in platform_release and '21.' not in platform_release) or (platform_machine == 'arm64' and '20.' not in platform_release and '21.' not in platform_release and '22.' not in platform_release))",
    "onnxruntime>=1.17; (python_version >= '3.11' or sys_platform != 'win32' or platform_machine != 'ARM64') and (sys_platform != 'darwin' or python_version < '3.13' or (python_version < '3.14' and '20.' not in platform_release and '21.' not in platform_release) or (platform_machine == 'arm64' and '20.' not in platform_release and '21.' not in platform_release and '22.' not in platform_release))",
    "tokenizers>=0.15; (python_version >= '3.11' or sys_platform != 'win32' or platform_machine != 'ARM64') and (sys_platform != 'darwin' or python_version < '3.13' or (python_version < '3.14' and '20.' not in platform_release and '21.' not in platform_release) or (platform_machine == 'arm64' and '20.' not in platform_release and '21.' not in platform_release and '22.' not in platform_release))",
]

[project.optional-dependencies]
# certifi: urllib's default verification fails on Windows boxes whose cert
# store lacks an intermediate (pip succeeds there only because it vendors
# certifi); the pinned-model fetch needs the same bundle.
semantic = ["certifi", "numpy>=1.24", "onnxruntime>=1.17", "tokenizers>=0.15"]
# Metal embedding lane: ONE dependency, deliberately. The obvious route was
# mlx-embeddings, but it requires transformers (which drags starlette, uvicorn
# and typer into a log-search CLI) and pins tokenizers below the version the
# base install resolves. py/mlx_modernbert.py carries the encoder instead, so
# the extra costs exactly mlx. Apple-Silicon marked because mlx ships no wheels
# elsewhere. Absent it every path is the ONNX CPU lane; present, new stores
# default to Metal (embedder.default_lane) and AGREP_MLX=off opts out.
# kept for explicit installs and older instructions; the base install already
# carries mlx on supported Apple silicon.
metal = ["mlx>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.urls]
Homepage = "https://github.com/dannyisbad/agrep"
Repository = "https://github.com/dannyisbad/agrep"

[project.scripts]
agrep = "agrep.__main__:main"

[tool.hatch.version]
path = "agrep/__init__.py"

# --- wheel contents -----------------------------------------------------------
# The repo is a flat tree (cli.py, reindex.py, py/) plus a cargo target.
# force-include maps those into the agrep/ package dir at build time WITHOUT moving
# them in the repo, so dev keeps working unchanged. _bin/agrep-rs is dropped in by CI
# (or a local build) before packaging; it's gitignored.
[tool.hatch.build.targets.wheel]
packages = ["agrep"]
artifacts = ["agrep/_bin/*", "_bin/*"]

[tool.hatch.build.targets.wheel.force-include]
"_bin" = "agrep/_bin"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# sdist carries the rust source too, so `pip install` from source can cargo-build.
[tool.hatch.build.targets.sdist]
include = [
    "/agrep/", "/cli.py", "/reindex.py",
    "/py/", "/crates/", "/Cargo.toml", "/Cargo.lock",
    "/hatch_build.py", "/hatch_sdist_build.py", "/sdist_sources.py",
    "/rust-toolchain.toml", "/README.md", "/LICENSE",
    "/THIRD_PARTY_LICENSES.txt",
]
only-include = ["sdist_sources.py"]
exclude = [
    "/npm",
    "/crates/*/tests",
    "/py/_test_support.py",
    "/py/fixtures",
    "/py/generate_boundary_fixtures.py",
    "/py/selftest.py",
    "/py/test_*.py",
]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_sdist_build.py"
